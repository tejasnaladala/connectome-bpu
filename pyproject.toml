[project]
name = "connectome-bpu"
version = "0.2.0"
description = "Controlled connectome architecture benchmarks"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.8,<4",
    "networkx>=3.2,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "rich>=13,<15",
    "scipy>=1.12,<2",
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["models", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
